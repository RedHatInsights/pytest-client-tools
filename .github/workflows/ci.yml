name: CI
permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-test:
    name: "test from sources"
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.6"
          - "3.9"
          - "3.12"
        include:
          - name: "Fedora Latest"
            image: "registry.fedoraproject.org/fedora:43"
    runs-on: 'ubuntu-latest'
    container:
      image: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install python3 and pip
        run: |
          dnf --setopt install_weak_deps=False install -y python${{ matrix.python-version }} python3-pip
      
      - name: Create venv
        run: |
          python${{ matrix.python-version }} -m venv local_env
      
      - name: Enter venv and install test requirements
        run: |
          source ./local_env/bin/activate && pip install -r test-requirements.txt

      - name: Enter venv and Run tests
        run: |
          source ./local_env/bin/activate && pytest

  install-test:
    name: "test as installed"
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.6"
          - "3.9"
          - "3.12"
        include:
          - name: "Fedora Latest"
            image: "registry.fedoraproject.org/fedora:43"
          - python-version: "3.6"
            expected-dynaconf: "3.1.5"
          - python-version: "3.9"
            expected-dynaconf: "3.3.0"
          - python-version: "3.12"
            expected-dynaconf: "3.3.5"
    runs-on: 'ubuntu-latest'
    container:
      image: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sources
          persist-credentials: false

      - name: Install necessary tools in Fedora container
        run: |
          dnf --setopt install_weak_deps=False install -y python${{ matrix.python-version }} python3-pip

      - name: Create venv
        run: |
          python${{ matrix.python-version }} -m venv local_env

      - name: Install the checkout from sources via pip
        run: |
          source ./local_env/bin/activate && pip install ./sources

      - name: Check interpreter and resolved dynaconf version
        run: |
          source ./local_env/bin/activate
          python --version
          python -m pip show dynaconf
          python --version 2>&1 | grep -q "Python ${{ matrix.python-version }}\."
          test "$(python -m pip show dynaconf | sed -n 's/^Version: //p')" = "${{ matrix.expected-dynaconf }}"

      - name: Install test requirements
        run: |
          source ./local_env/bin/activate && pip install -r sources/test-requirements.txt

      - name: Run tests
        run: |
          source ./local_env/bin/activate && pytest sources/tests

  floor-test:
    name: "test dynaconf floor"
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.12"
        include:
          - name: "Fedora Latest"
            image: "registry.fedoraproject.org/fedora:43"
    runs-on: 'ubuntu-latest'
    container:
      image: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install python3 and pip
        run: |
          dnf --setopt install_weak_deps=False install -y python${{ matrix.python-version }} python3-pip

      - name: Create venv
        run: |
          python${{ matrix.python-version }} -m venv local_env

      - name: Enter venv and install test requirements at the dynaconf floor
        run: |
          source ./local_env/bin/activate && pip install dynaconf==3.2.13 && pip install -r test-requirements.txt

      - name: Check resolved dynaconf version
        run: |
          source ./local_env/bin/activate
          python -m pip show dynaconf
          test "$(python -m pip show dynaconf | sed -n 's/^Version: //p')" = "3.2.13"

      - name: Enter venv and Run tests
        run: |
          source ./local_env/bin/activate && pytest
